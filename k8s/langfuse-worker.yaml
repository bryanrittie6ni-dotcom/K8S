apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: llmops
  labels:
    app: langfuse-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-0-10-ubuntu
      imagePullSecrets:
        - name: ccr-registry
      containers:
        - name: langfuse-worker
          image: ccr.ccs.tencentyun.com/my-app-20/langfuse-worker:3
          ports:
            - containerPort: 3030
              name: http
          envFrom:
            - secretRef:
                name: langfuse-secrets
            - configMapRef:
                name: langfuse-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3030"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-worker
  namespace: llmops
  labels:
    app: langfuse-worker
spec:
  type: ClusterIP
  selector:
    app: langfuse-worker
  ports:
    - port: 3030
      targetPort: 3030
      name: http
