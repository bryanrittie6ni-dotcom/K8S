apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: llmops
  labels:
    app: langfuse-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-0-10-ubuntu
      imagePullSecrets:
        - name: ccr-registry
      containers:
        - name: langfuse-web
          image: ccr.ccs.tencentyun.com/my-app-20/langfuse-web:3
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: langfuse-secrets
            - configMapRef:
                name: langfuse-config
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: llmops
  labels:
    app: langfuse-web
spec:
  type: ClusterIP
  selector:
    app: langfuse-web
  ports:
    - port: 3000
      targetPort: 3000
      name: http
